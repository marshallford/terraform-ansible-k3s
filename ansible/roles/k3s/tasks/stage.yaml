- name: Stage K3s artifacts from the control node
  when: k3s_artifact_source_host == 'localhost'
  block:
  - name: Download K3s artifacts to the control node
    delegate_to: "{{ k3s_artifact_source_host }}"
    become: false
    block:
    - name: Ensure K3s download directory exists
      ansible.builtin.file:
        path: "{{ __k3s_download_dir }}"
        state: directory
        mode: u=rwx,g=rwx,o=rx

    - name: Download K3s artifacts
      ansible.builtin.get_url:
        url: "{{ item.download_url }}"
        dest: "{{ __k3s_download_dir }}/{{ item.name }}"
        checksum: "{{ item.download_checksum }}"
        mode: u=rw,g=r,o=r
      loop: "{{ __k3s_artifacts }}"
      loop_control:
        label: "{{ item.name }}"

  - name: Copy K3s artifacts
    ansible.builtin.copy:
      src: "{{ __k3s_download_dir }}/{{ item.name }}"
      dest: "{{ __k3s_staging_dir }}/{{ item.name }}"
      mode: u=rw,g=r,o=r
    loop: "{{ __k3s_artifacts }}"
    loop_control:
      label: "{{ item.name }}"

- name: Stage K3s artifacts from another machine
  when: k3s_artifact_source_host != 'localhost'
  block:
  - name: Checksum K3s artifacts on the source machine
    ansible.builtin.stat:
      path: "{{ __k3s_staging_dir }}/{{ item.name }}"
      checksum_algorithm: sha256
      get_mime: false
    loop: "{{ __k3s_artifacts }}"
    loop_control:
      label: "{{ item.name }}"
    register: __k3s_source_artifacts
    failed_when: not __k3s_source_artifacts.stat.exists
    delegate_to: "{{ k3s_artifact_source_host }}"

  - name: Download K3s artifacts from the source machine
    ansible.builtin.get_url:
      url: "{{ __k3s_artifact_source_url }}/{{ item.name }}"
      dest: "{{ __k3s_staging_dir }}/{{ item.name }}"
      checksum: "sha256:{{ __k3s_source_artifacts.results[index].stat.checksum }}"
      use_proxy: false
      mode: u=rw,g=r,o=r
    loop: "{{ __k3s_artifacts }}"
    loop_control:
      label: "{{ item.name }}"
      index_var: index
