- name: Assertions
  ansible.builtin.assert:
    that:
    - ansible_version.full is version_compare('2.18.0', '>=')
    - ansible_facts.distribution == 'Fedora'
    - ansible_facts.distribution_major_version | int >= 43
    quiet: true

- name: Set unprivileged port start
  ansible.posix.sysctl:
    name: net.ipv4.ip_unprivileged_port_start
    value: "{{ __quadlet_unprivileged_port_start }}"
  become: true

- name: Create systemd user directory
  ansible.builtin.file:
    path: "{{ __quadlet_user_systemd_dir }}"
    state: directory
    owner: "{{ __quadlet_user }}"
    group: "{{ __quadlet_user }}"
    mode: u=rwx,g=rx,o=rx

- name: Create quadlet user directory
  ansible.builtin.file:
    path: "{{ __quadlet_user_containers_dir }}"
    state: directory
    owner: "{{ __quadlet_user }}"
    group: "{{ __quadlet_user }}"
    mode: u=rwx,g=rx,o=rx

- name: Create quadlet system directory
  ansible.builtin.file:
    path: "{{ __quadlet_system_containers_dir }}"
    state: directory
    owner: root
    group: root
    mode: u=rwx,g=rx,o=rx
  become: true

- name: Ensure lingering for user is enabled
  ansible.builtin.command:
    cmd: loginctl enable-linger {{ __quadlet_user }}
    creates: /var/lib/systemd/linger/{{ __quadlet_user }}

- name: Set quadlet facts
  ansible.builtin.set_fact:
    quadlet_user_info:
      name: "{{ __quadlet_user }}"
      xdg_runtime_dir: "/run/user/{{ ansible_facts.user_uid }}"
      systemd_dir: "{{ __quadlet_user_systemd_dir }}"
      containers_dir: "{{ __quadlet_user_containers_dir }}"
      volumes_dir: "{{ __quadlet_user_volumes_dir }}"
    quadlet_system_info:
      systemd_dir: "{{ __quadlet_system_systemd_dir }}"
      containers_dir: "{{ __quadlet_system_containers_dir }}"
      volumes_dir: "{{ __quadlet_system_volumes_dir }}"
