- name: Reset machines
  hosts: agents:servers
  gather_facts: true
  become: false
  serial: 1
  tasks:
  - name: Quadlet
    ansible.builtin.include_role:
      name: quadlet
    when: k3s_role == "server"
  - name: HAProxy
    ansible.builtin.include_role:
      name: haproxy
      tasks_from: down
    when: k3s_role == "server"
  - name: Keepalived
    ansible.builtin.include_role:
      name: keepalived
      tasks_from: down
      apply:
        become: true
    when: k3s_role == "server"
  - name: Reset k3s
    ansible.builtin.include_role:
      name: k3s
      tasks_from: reset
      apply:
        become: true
