- name: Stop zincati
  ansible.builtin.systemd_service:
    name: zincati
    state: stopped
  when: system_upgrade_requested | default(false)

- name: System upgrade
  ansible.posix.rpm_ostree_upgrade:
    allow_downgrade: true
    cache_only: true
  when: system_upgrade_requested | default(false)
  register: __system_upgrade

- name: Reboot # noqa: no-handler
  ansible.builtin.reboot:
    reboot_timeout: 1800 # 30m
    post_reboot_delay: 60 # 1m, https://github.com/ansible/ansible/issues/86122
  when: __system_upgrade is changed

- name: Start zincati
  ansible.builtin.systemd_service:
    name: zincati
    state: started
  when: system_upgrade_requested | default(false) and __system_upgrade is not changed

- name: Set upgrade trigger
  ansible.builtin.copy:
    content: "{{ system_upgrade_trigger }}"
    dest: "{{ __system_upgrade_trigger_file_path }}"
    mode: u=rw,g=,o=
