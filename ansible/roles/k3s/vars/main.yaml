__k3s_all_nodes_config_base:
  server: "{{ k3s_server }}"
__k3s_server_nodes_config_base:
  cluster-init: "{{ k3s_cluster_init }}"
  server: "{{ none if k3s_cluster_init else k3s_server }}"
  https-listen-port: "{{ __k3s_https_listen_port }}"
  tls-san: "{{ k3s_tls_san }}"
__k3s_config: >-
  {{ (k3s_role == 'server') | ternary(
    ([k3s_node_config, k3s_server_nodes_config, k3s_all_nodes_config, __k3s_server_nodes_config_base] | combine),
    ([k3s_node_config, k3s_all_nodes_config, __k3s_all_nodes_config_base] | combine)
  )}}
