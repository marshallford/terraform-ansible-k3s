- name: Pull haproxy image
  ansible.builtin.systemd_service:
    name: haproxy-image.service
    daemon_reload: true
    state: restarted
    scope: user
  environment:
    XDG_RUNTIME_DIR: "{{ quadlet_user_info.xdg_runtime_dir }}"

- name: Restart haproxy socket
  ansible.builtin.systemd_service:
    name: haproxy.socket
    daemon_reload: true
    state: restarted
    scope: user
  environment:
    XDG_RUNTIME_DIR: "{{ quadlet_user_info.xdg_runtime_dir }}"

- name: Reload haproxy
  ansible.builtin.systemd_service:
    name: haproxy.service
    daemon_reload: true
    state: reloaded
    scope: user
  environment:
    XDG_RUNTIME_DIR: "{{ quadlet_user_info.xdg_runtime_dir }}"

- name: Restart haproxy
  ansible.builtin.systemd_service:
    name: haproxy.service
    daemon_reload: true
    state: restarted
    scope: user
  environment:
    XDG_RUNTIME_DIR: "{{ quadlet_user_info.xdg_runtime_dir }}"
