- name: Ensure K3s directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode | default('u=rwx,g=,o=') }}"
  loop:
  - path: "{{ __k3s_config_dir }}"
  - path: "{{ __k3s_files_dir }}"
  - path: "{{ __k3s_images_dir }}"
  - path: "{{ __k3s_kubelet_config_dir }}"
  - path: "{{ __k3s_staging_dir }}"
    mode: u=rwx,g=rx,o=rx
  loop_control:
    label: "{{ item.path }}"

- name: Ensure K3s manifests directory exists
  ansible.builtin.file:
    path: "{{ __k3s_manifests_dir }}"
    state: directory
    mode: u=rwx,g=,o=
  when: k3s_role == "server"

- name: Set K3s env file
  ansible.builtin.template:
    src: k3s.env.j2
    dest: "{{ __k3s_config_dir }}/k3s.env"
    mode: u=rw,g=,o=
  no_log: true

- name: Copy auto deployed manifests
  ansible.builtin.copy:
    content: "{{ item.value }}"
    dest: "{{ __k3s_manifests_dir }}/{{ item.key }}"
    mode: u=rw,g=,o=
  loop: "{{ k3s_manifests | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: __k3s_manifests_copy
  when: k3s_role == "server"

- name: Find existing auto deployed manifests
  ansible.builtin.find:
    paths: "{{ __k3s_manifests_dir }}"
    patterns: "*"
  register: __k3s_manifests_current
  when: k3s_role == "server"

- name: Prune auto deployed manifests
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ (__k3s_manifests_current.files | map(attribute='path')) | difference(__k3s_manifests_copy.results | map(attribute='dest') | list) }}"
  loop_control:
    label: "{{ item | basename }}"
  when: k3s_role == "server"

- name: Harden kernel parameters for kubelet
  ansible.builtin.template:
    src: 90-kubelet.conf.j2
    dest: /etc/sysctl.d/90-kubelet.conf
    mode: u=rw,g=,o=
  notify: Restart systemd-sysctl

- name: Ensure K3s artifact server systemd service
  ansible.builtin.template:
    src: k3s-artifact-server.service.j2
    dest: /etc/systemd/system/k3s-artifact-server.service
    mode: u=rw,g=r,o=r
  notify: Restart k3s-artifact-server

- name: Start and enable K3s artifact server
  ansible.builtin.systemd_service:
    name: k3s-artifact-server
    state: started
    enabled: true
    daemon_reload: true

- name: Set K3s architecture fact
  ansible.builtin.set_fact:
    k3s_arch: "{{ 'arm64' if ansible_facts.architecture == 'aarch64' else 'arm' if ansible_facts.architecture == 'armv7l' else 'amd64' }}"

- name: Check if K3s artifacts exist
  ansible.builtin.stat:
    path: "{{ __k3s_staging_dir }}/{{ item.name }}"
  loop: "{{ __k3s_artifacts }}"
  loop_control:
    label: "{{ item.name }}"
  register: __k3s_artifacts_check

- name: Check if K3s service is enabled
  ansible.builtin.command:
    cmd: systemctl is-enabled --quiet k3s-{{ k3s_role }}.service # noqa:command-instead-of-module
  register: __k3s_service_enabled
  failed_when: false
  changed_when: false

- name: Check if K3s etcd is initialized
  ansible.builtin.stat:
    path: "{{ __k3s_etcd_wal_dir }}"
  register: __k3s_etcd_check
  when: k3s_role == "server"

- name: Set K3s facts
  ansible.builtin.set_fact:
    k3s_staged: "{{ __k3s_artifacts_check.results | map(attribute='stat.exists') is all }}"
    k3s_installed: "{{ __k3s_service_enabled.rc == 0 }}"
    k3s_etcd_initialized: "{{ __k3s_etcd_check.stat.exists | default(false) }}"
