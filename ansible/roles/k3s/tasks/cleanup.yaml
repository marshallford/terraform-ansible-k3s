- name: Find all staging files
  ansible.builtin.find:
    paths: "{{ __k3s_staging_dir }}"
    patterns: "k3s-*.bin,images-*.tar.zst,selinux-*.rpm"
  register: __k3s_current_staging_dir

- name: Prune staging files
  ansible.builtin.file:
    path: "{{ __k3s_staging_dir }}/{{ item }}"
    state: absent
  loop: "{{ (__k3s_current_staging_dir.files | map(attribute='path') | map('basename')) | difference(live_files | list) }}"
  vars:
    live_files:
    - k3s-{{ k3s_version }}.bin
    - images-{{ k3s_version }}.tar.zst
    - selinux-{{ k3s_selinux_version }}.rpm
