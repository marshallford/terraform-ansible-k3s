- name: Gather rpm-ostree status
  ansible.builtin.command:
    cmd: rpm-ostree status --json
  register: __rpm_ostree_status_json
  changed_when: false

- name: Set rpm-ostree status facts
  ansible.builtin.set_fact:
    rpm_ostree_status_packages: "{{ first.packages }}"
    rpm_ostree_status_booted_packages: "{{ booted.packages }}"
    rpm_ostree_status_local_packages: "{{ first['requested-local-packages'] }}"
    rpm_ostree_status_booted_local_packages: "{{ booted['requested-local-packages'] }}"
    rpm_ostree_status_base_checksum: "{{ first['base-checksum'] | default(first.checksum, true) }}"
    rpm_ostree_status_booted_base_checksum: "{{ booted['base-checksum'] | default(booted.checksum, true) }}"
  vars:
    status: "{{ __rpm_ostree_status_json.stdout | from_json }}"
    first: "{{ status.deployments | first }}"
    booted: "{{ status.deployments | selectattr('booted', 'eq', true) | list | first }}"
