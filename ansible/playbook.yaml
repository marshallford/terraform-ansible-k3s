- name: Initialize machines
  hosts: servers:agents
  gather_facts: false
  become: false
  tasks:
  - name: Wait for hosts
    ansible.builtin.wait_for_connection:
      timeout: 600
  - name: Gather facts
    ansible.builtin.setup:
  - name: Gather rpm-ostree facts
    ansible.builtin.include_role:
      name: rpm_ostree_status
  - name: Quadlet
    ansible.builtin.include_role:
      name: quadlet
  - name: Interface facts
    ansible.builtin.set_fact:
      interfaces_with_ipv4_addr: "{{ ansible_facts.interfaces | map('extract', ansible_facts) | selectattr('ipv4.address', 'defined') }}"
- name: Add new and removed hosts to inventory
  hosts: localhost
  gather_facts: false
  become: false
  tasks:
  - name: Inventory difference
    ansible.builtin.include_role:
      name: inventory_difference
    vars:
      inventory_difference_previous_inventory_file: "{{ lookup('env', 'ANSIBLE_TF_PREVIOUS_INVENTORY') }}"
      inventory_difference_current_inventory_file: "{{ lookup('env', 'ANSIBLE_TF_INVENTORY') }}"
- name: Validate K3s server topology
  hosts: localhost
  gather_facts: false
  become: false
  tasks:
  - name: Validate
    ansible.builtin.include_role:
      name: k3s
      tasks_from: validate
    vars:
      k3s_removed_servers: "{{ groups['removed_servers'] | default([]) }}"
      k3s_retained_servers: "{{ groups['servers'] | default([]) | difference(groups['new_servers'] | default([])) }}"
  - name: Select control server
    ansible.builtin.add_host:
      name: "{{ (groups['servers'] | default([]) | difference(groups['new_servers'] | default([])) | sort | first) | default(groups['bootstrap_server'] | first) }}"
      groups: control_server
- name: Configure firewall
  hosts: all
  gather_facts: false
  become: true
  tasks:
  - name: Firewall
    ansible.builtin.include_role:
      name: nftables
  - name: Firewall rules for K3s
    ansible.builtin.include_role:
      name: nftables
      tasks_from: rules
    vars:
      nftables_rules_name: 50-k3s
      nftables_rules: >-
        {{
          (
            groups['all'] | map('extract', hostvars, 'firewall_node_rules') | flatten +
            firewall_k3s_rules
          ) | unique
        }}
  - name: Firewall rules from user input
    ansible.builtin.include_role:
      name: nftables
      tasks_from: rules
    vars:
      nftables_rules_name: 90-user
      nftables_rules: "{{ firewall_rules }}"
- name: Configure API server load balancer
  hosts: servers
  gather_facts: false
  become: false
  serial: "{{ (lookup('ansible.builtin.env', 'ANSIBLE_TF_OPERATION') == 'create') | ternary(omit, 1) }}"
  tasks:
  - name: Keepalived
    ansible.builtin.include_role:
      name: keepalived
      apply:
        become: true
  - name: HAProxy
    ansible.builtin.include_role:
      name: haproxy
    vars:
      haproxy_keepalived_vip_interface: >-
        {{
          interfaces_with_ipv4_addr | selectattr('ipv4.address', 'equalto', k3s_node_config['node-external-ip']) |
          map(attribute='device') | default([none], true) | first
        }}
      haproxy_keepalived_vrrp_interface: >-
        {{
          interfaces_with_ipv4_addr | selectattr('ipv4.address', 'equalto', k3s_node_config['node-ip']) |
          map(attribute='device') | default([none], true) | first
        }}
- name: Prepare machines for K3s
  hosts: servers:agents
  gather_facts: false
  become: true
  tasks:
  - name: Prepare
    ansible.builtin.include_role:
      name: k3s
      tasks_from: prepare
  - name: System upgrade setup
    ansible.builtin.include_role:
      name: system_upgrade
      tasks_from: setup
- name: Stage K3s artifacts on machines
  hosts: servers:agents
  gather_facts: false
  become: true
  vars:
    same_arch_machines: "{{ query('inventory_hostnames', 'servers:agents') | map('extract', hostvars) | selectattr('k3s_arch', 'eq', k3s_arch) }}"
    machines_with_artifacts: "{{ same_arch_machines | selectattr('k3s_staged') | map(attribute='inventory_hostname') | list }}"
    first_machine_without_artifacts: "{{ same_arch_machines | rejectattr('k3s_staged') | map(attribute='inventory_hostname') | sort | first }}"
    k3s_artifact_source_host: >-
      {{
        (machines_with_artifacts | shuffle(seed=inventory_hostname) | first) if machines_with_artifacts else
        'localhost' if inventory_hostname == first_machine_without_artifacts else
        first_machine_without_artifacts
      }}
  tasks:
  - name: Stage
    ansible.builtin.include_role:
      name: k3s
      tasks_from: stage
    when: not k3s_staged
- name: Bootstrap K3s cluster
  hosts: bootstrap_server
  gather_facts: false
  become: true
  vars:
    k3s_cluster_init: true
    k3s_delegated_server_host: "{{ inventory_hostname }}"
  tasks:
  - name: Configure node
    when:
    - lookup('ansible.builtin.env', 'ANSIBLE_TF_OPERATION') == 'create'
    - groups['servers'] | map('extract', hostvars, 'k3s_etcd_initialized') | list is not any
    block: &configure_node
    - name: Check cluster health
      ansible.builtin.include_role:
        name: k3s
        tasks_from: check_nodes
      when: k3s_installed
    - name: Cordon and drain node
      ansible.builtin.include_role:
        name: k3s
        tasks_from: drain
        apply:
          delegate_to: "{{ k3s_delegated_server_host }}"
      when: k3s_installed
    - name: System upgrade
      ansible.builtin.include_role:
        name: system_upgrade
        tasks_from: upgrade
    - name: Configure K3s
      ansible.builtin.include_role:
        name: k3s
        tasks_from: configure
    - name: Uncordon node
      ansible.builtin.include_role:
        name: k3s
        tasks_from: uncordon
      when: k3s_installed
- name: Configure new K3s servers
  hosts: new_servers
  gather_facts: false
  become: true
  serial: 1
  vars:
    k3s_delegated_server_host: "{{ groups.control_server | first }}"
  tasks: *configure_node
- name: Configure existing K3s servers
  hosts: servers:!new_servers
  gather_facts: false
  become: true
  serial: 1
  vars:
    k3s_delegated_server_host: "{{ groups.control_server | first }}"
  tasks: *configure_node
- name: Configure new K3s agents
  hosts: new_agents
  gather_facts: false
  become: true
  vars:
    k3s_delegated_server_host: "{{ groups.control_server | first }}"
  tasks: *configure_node
- name: Configure existing K3s agents
  hosts: agents:!new_agents
  gather_facts: false
  become: true
  serial: 1
  vars:
    k3s_delegated_server_host: "{{ groups.control_server | first }}"
  tasks: *configure_node
- name: Cleanup machines
  hosts: servers:agents
  gather_facts: false
  become: true
  tasks:
  - name: Cleanup
    ansible.builtin.include_role:
      name: k3s
      tasks_from: cleanup
    when: k3s_cleanup
- name: Reset removed machines
  hosts: removed_servers:removed_agents
  gather_facts: true
  become: false
  serial: 1
  tasks:
  - name: Quadlet
    ansible.builtin.include_role:
      name: quadlet
    when: k3s_role == "server"
  - name: HAProxy
    ansible.builtin.include_role:
      name: haproxy
      tasks_from: down
    when: k3s_role == "server"
  - name: Keepalived
    ansible.builtin.include_role:
      name: keepalived
      tasks_from: down
      apply:
        become: true
    when: k3s_role == "server"
  - name: Cordon and drain node
    ansible.builtin.include_role:
      name: k3s
      tasks_from: drain
      apply:
        become: true
        delegate_to: "{{ groups.control_server | first }}"
  - name: Reset K3s
    ansible.builtin.include_role:
      name: k3s
      tasks_from: reset
      apply:
        become: true
  - name: Firewall
    ansible.builtin.include_role:
      name: nftables
      tasks_from: down
      apply:
        become: true
  - name: Delete node from cluster
    ansible.builtin.include_role:
      name: k3s
      tasks_from: delete
      apply:
        become: true
        delegate_to: "{{ groups.control_server | first }}"
- name: Reconfigure firewall
  hosts: servers:agents
  gather_facts: false
  become: true
  tasks:
  - name: Firewall rules for K3s
    ansible.builtin.include_role:
      name: nftables
      tasks_from: rules
    vars:
      nftables_rules_name: 50-k3s
      nftables_rules: "{{ firewall_node_rules + firewall_k3s_rules }}"
    when: groups['removed_all'] | default([]) | length > 0
