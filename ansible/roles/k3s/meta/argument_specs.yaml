argument_specs:
  validate:
    options:
      k3s_removed_servers:
        type: list
        elements: str
        required: true
      k3s_retained_servers:
        type: list
        elements: str
        required: true
  prepare:
    options:
      k3s_role:
        type: str
        required: true
      k3s_version:
        type: str
      k3s_selinux_version:
        type: str
      k3s_server_token:
        type: str
        required: true
      k3s_agent_token:
        type: str
        required: true
      k3s_manifests:
        type: dict
  download:
